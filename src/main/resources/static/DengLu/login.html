<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双虎人事管理系统 - 登录</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body {
            margin: 0; padding: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
            font-family: "Microsoft YaHei", sans-serif;
        }
        .login-card {
            background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 350px; text-align: center;
        }
        .title { color: #333; margin-bottom: 10px; font-size: 24px; font-weight: bold; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; }
        .input-field {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; outline: none; transition: 0.3s;
        }
        .input-field:focus { border-color: #8ec5fc; box-shadow: 0 0 5px rgba(142, 197, 252, 0.5); }
        .btn-login {
            width: 100%; padding: 12px; background-color: #4facfe; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; transition: 0.3s;
        }
        .btn-login:hover { background-color: #00f2fe; }
        .btn-login:disabled { background-color: #ccc; cursor: not-allowed; }
        .error-msg { color: #ff4d4f; font-size: 13px; margin-top: 10px; min-height: 20px; }
        /* 新增：注册链接样式 */
        .register-link { margin-top: 15px; font-size: 14px; }
        .register-link a { color: #4facfe; text-decoration: none; }
        .register-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div id="app">
    <div class="login-card">
        <div class="title">双虎人事管理系统</div>
        <div class="subtitle">Shuanghu Personnel Management System</div>

        <div class="form-group">
            <label>用户名 / 工号</label>
            <input type="text" v-model="form.username" class="input-field" placeholder="请输入用户名">
        </div>

        <div class="form-group">
            <label>密码</label>
            <input type="password" v-model="form.password" class="input-field" placeholder="请输入密码">
        </div>

        <div class="form-group">
            <label>登录身份</label>
            <select v-model="form.role" class="input-field">
                <option disabled value="">请选择您的身份</option>
                <option value="3">普通员工</option>
                <option value="2">管理人员</option>
                <option value="1">超级用户</option>
            </select>
        </div>

        <button class="btn-login" @click="handleLogin" :disabled="loading">
            {{ loading ? '登录中...' : '登 录' }}
        </button>

        <div class="error-msg">{{ message }}</div>

        <div class="register-link">
            没有账号？ <a href="register.html">立即注册</a>
        </div>
    </div>
</div>
<script>
    const { createApp, ref, reactive, onMounted } = Vue;

    createApp({
        setup() {
            const form = reactive({ username: '', password: '', role: '' });
            const loading = ref(false);
            const message = ref('');

            const setCookie = (name, value, days = 7) => {
                const exp = new Date();
                exp.setTime(exp.getTime() + days * 24 * 60 * 60 * 1000);
                document.cookie = `${name}=${encodeURIComponent(value)};expires=${exp.toUTCString()};path=/`;
            };

            const getCookie = (name) => {
                const reg = new RegExp("(^| )" + name + "=([^;]*)(;|$)");
                const arr = document.cookie.match(reg);
                return arr ? decodeURIComponent(arr[2]) : null;
            };

            onMounted(() => {
                const savedUser = getCookie("username");
                const savedRole = getCookie("role_id"); // 建议存 role_id
                if (savedUser && savedRole) {
                    form.username = savedUser;
                    // 安全起见，通常不自动填充密码，或者密码只存在 Session 里
                    form.role = savedRole;
                }
            });

            const handleLogin = () => {
                if (!form.username || !form.password || !form.role) {
                    message.value = "请填写完整的登录信息（含身份）";
                    return;
                }
                loading.value = true;
                message.value = "";

                fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: form.username,
                        password: form.password,
                        role: form.role // 发送角色给后端校验
                    })
                })
                    .then(res => res.json())
                    .then(res => {
                        loading.value = false;
                        if (res.success) {
                            const user = res.data;
                            setCookie("username", user.username, 7);
                            setCookie("role_id", user.user_role, 7); // 存角色ID以便下次自动选

                            message.value = "登录成功！正在跳转...";
                            setTimeout(() => {
                                window.location.href = "/dept_manage_final_fixed.html";
                            }, 800);
                        } else {
                            message.value = res.message;
                        }
                    })
                    .catch(err => {
                        loading.value = false;
                        message.value = "网络连接错误";
                    });
            };

            return { form, loading, message, handleLogin };
        }
    }).mount('#app');
</script>
</body>
</html>
