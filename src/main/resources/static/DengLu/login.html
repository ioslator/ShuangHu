<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双虎人事管理系统 - 登录</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        /* 简单的 CSS 美化 */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 背景色 */
            background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
            font-family: "Microsoft YaHei", sans-serif;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }

        .title {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: bold;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* 确保内边距不撑大宽度 */
            outline: none;
            transition: 0.3s;
        }

        .input-field:focus {
            border-color: #8ec5fc;
            box-shadow: 0 0 5px rgba(142, 197, 252, 0.5);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #4facfe;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-login:hover {
            background-color: #00f2fe;
        }

        .btn-login:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .error-msg {
            color: #ff4d4f;
            font-size: 13px;
            margin-top: 10px;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="login-card">
        <div class="title">双虎人事管理系统</div>
        <div class="subtitle">Shuanghu Personnel Management System</div>

        <div class="form-group">
            <label>用户名 / 工号</label>
            <label>
                <input type="text" v-model="form.username" class="input-field" placeholder="请输入用户名">
            </label>
        </div>

        <div class="form-group">
            <label>密码</label>
            <label>
                <input type="password" v-model="form.password" class="input-field" placeholder="请输入密码">
            </label>
        </div>

        <div class="form-group">
            <label>登录身份</label>
            <label>
                <select v-model="form.role" class="input-field">
                    <option disabled value="">请选择您的身份</option>
                    <option value="3">普通员工</option>
                    <option value="2">管理人员</option>
                    <option value="1">超级用户</option>
                </select>
            </label>
        </div>

        <button class="btn-login" @click="handleLogin" :disabled="loading">
            {{ loading ? '登录中...' : '登 录' }}
        </button>

        <div class="error-msg">{{ message }}</div>
    </div>
</div>
<script>
    const { createApp, ref, reactive, onMounted } = Vue;

    createApp({
        setup() {
            // 1. 表单数据
            const form = reactive({
                username: '',
                password: '',
                role: ''
            });

            const loading = ref(false);
            const message = ref('');

            // 2. 记录密码错误次数（关键！）
            const wrongPwdCount = ref(0);

            // 3. 辅助函数：设置 Cookie（带过期时间，单位：天）
            const setCookie = (name, value, days = 7) => {
                const exp = new Date();
                exp.setTime(exp.getTime() + days * 24 * 60 * 60 * 1000);
                document.cookie = `${name}=${encodeURIComponent(value)};expires=${exp.toUTCString()};path=/`;
            };

            // 4. 获取 Cookie
            const getCookie = (name) => {
                const reg = new RegExp("(^| )" + name + "=([^;]*)(;|$)");
                const arr = document.cookie.match(reg);
                return arr ? decodeURIComponent(arr[2]) : null;
            };

            // 5. 删除所有相关 Cookie
            const clearLoginCookies = () => {
                document.cookie = "username=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
                document.cookie = "password=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
                document.cookie = "role=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
            };

            // 6. 页面加载时自动填充（记住密码功能）
            onMounted(() => {
                const savedUser = getCookie("username");
                const savedPwd = getCookie("password");
                const savedRole = getCookie("role");

                if (savedUser && savedPwd && savedRole) {
                    form.username = savedUser;
                    form.password = savedPwd;
                    form.role = savedRole;
                    message.value = "已自动填充上次登录信息";
                }
            });

            // 7. 主登录逻辑（全部要求都在这里实现！）
            const handleLogin = () => {
                if (!form.username || !form.password) {
                    message.value = "请填写完整的登录信息";
                    return;
                }
                loading.value = true;
                message.value = "";

                // 发送真实请求给后端 AuthController
                fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: form.username,
                        password: form.password,
                        role: form.role
                    })
                })
                    .then(res => res.json())
                    .then(res => {
                        loading.value = false;
                        if (res.success) {
                            // 登录成功
                            const user = res.data;
                            // 存 Cookie (注意: user_role 是数据库字段)
                            setCookie("username", user.username, 7);
                            setCookie("role", user.user_role === 1 ? 'admin' : 'employee', 7);

                            message.value = "登录成功！正在跳转...";
                            setTimeout(() => {
                                // 跳转到主页
                                window.location.href = "/dept_manage_final_fixed.html";
                            }, 800);
                        } else {
                            // 登录失败
                            message.value = res.message; // 显示后端返回的错误信息
                        }
                    })
                    .catch(err => {
                        loading.value = false;
                        message.value = "网络连接错误";
                    });
            };

            // 角色中文显示
            const getRoleName = (role) => {
                const map = {
                    employee: '普通员工',
                    manager: '管理人员',
                    admin: '超级用户',
                    visitor: '访客'
                };
                return map[role] || role;
            };

            return {
                form,
                loading,
                message,
                handleLogin,
                getRoleName
            };
        }
    }).mount('#app');
</script>
</body>
</html>
