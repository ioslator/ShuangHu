<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>提交请假申请</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <style>
        body { background-color: #f4f6f9; padding-bottom: 30px; }
        .card { border: none; border-radius: 0.75rem; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05); margin-top: 1.5rem; overflow: hidden; }
        .card-header { background: linear-gradient(135deg, #007bff 0%, #0056b3 100%); color: white; padding: 1.2rem 1.5rem; }
        .card-header h4 { font-weight: 600; font-size: 1.25rem; margin: 0; }
        .form-control { border-radius: 0.4rem; height: calc(2.8rem + 2px); }
        textarea.form-control { height: auto; padding-top: 10px; }
        label { font-weight: 600; color: #495057; }
        .btn-submit { border-radius: 50px; padding: 12px 40px; font-weight: 600; box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3); transition: all 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0, 123, 255, 0.4); }
    </style>
</head>
<body>

<div id="app" class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-9">
            <div class="card shadow-lg">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h4><i class="fas fa-file-signature mr-2"></i> 员工请假申请单</h4>
                    <span class="badge badge-light text-primary badge-pill px-3 py-2">Workflow</span>
                </div>

                <div class="card-body p-5">
                    <form @submit.prevent="submitLeave">
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label><i class="fas fa-id-card text-secondary mr-1"></i> 员工 ID (工号)</label>
                                <input type="number" v-model="form.emp_id" class="form-control" placeholder="请输入你的员工编号" required>
                            </div>
                            <div class="form-group col-md-6">
                                <label><i class="fas fa-tag text-info mr-1"></i> 请假类型</label>
                                <select v-model="form.leave_type" class="form-control" required>
                                    <option disabled value="">请选择类型</option>
                                    <option value="1">事假 (Personal Leave)</option>
                                    <option value="2">病假 (Sick Leave)</option>
                                    <option value="3">年假 (Annual Leave)</option>
                                    <option value="4">调休 (Compensatory Leave)</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label><i class="far fa-calendar-alt text-warning mr-1"></i> 开始日期</label>
                                <input type="date" v-model="form.leave_date" class="form-control" required>
                            </div>
                        </div>

                        <div class="form-group mt-3">
                            <label><i class="fas fa-pen text-primary mr-1"></i> 请假详细事由</label>
                            <textarea
                                    v-model="form.leave_reason"
                                    class="form-control"
                                    rows="5"
                                    maxlength="255"
                                    placeholder="请输入详细的请假理由，以便审批..."
                                    required
                            ></textarea>
                            <small class="text-muted float-right mt-1">{{ form.leave_reason.length }}/255 字</small>
                        </div>

                        <div class="text-center mt-5">
                            <button type="submit" class="btn btn-primary btn-submit">
                                <i class="fas fa-paper-plane mr-2"></i> 提交申请
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp } = Vue

    createApp({
        data() {
            return {
                form: { emp_id: '', leave_type: '', leave_date: '', leave_reason: '' }
            }
        },
        methods: {
            submitLeave() {
                if (!this.form.emp_id || !this.form.leave_type || !this.form.leave_date) {
                    alert("请填写完整信息！");
                    return;
                }
                const payload = {
                    emp_id: Number(this.form.emp_id),
                    leave_type: Number(this.form.leave_type),
                    leave_date: this.form.leave_date,
                    leave_reason: this.form.leave_reason,
                    status: 0
                };
                axios.post('/api/leave/apply', payload)
                    .then(res => {
                        if (res.data.success === true) {
                            alert("申请提交成功！请等待管理员审批。");
                            this.form.leave_reason = '';
                            this.form.leave_date = '';
                        } else {
                            alert("提交失败: " + res.data.message);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert("提交出错，请检查网络或后端服务");
                    });
            }
        }
    }).mount('#app')
</script>

</body>
</html>
