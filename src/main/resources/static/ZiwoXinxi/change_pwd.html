<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>修改密码 - 双虎人力资源管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            padding-top: 50px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .card {
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            padding: 1.5rem;
            border-bottom: none;
            text-align: center;
        }
        .card-header h5 {
            margin: 0;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .form-control {
            height: 45px;
            border-radius: 0.4rem;
        }
        .btn-submit {
            background: linear-gradient(135deg, #007bff 0%, #0062cc 100%);
            border: none;
            padding: 12px;
            border-radius: 50px;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
            transition: all 0.3s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 123, 255, 0.4);
        }
        .input-group-text {
            background-color: #fff;
            border-right: none;
        }
        .form-control {
            border-left: none;
        }
        .input-group-text + .form-control:focus {
            border-color: #ced4da; /* 保持边框颜色，避免只亮一半 */
            box-shadow: none; /* 去掉默认阴影，避免尴尬 */
        }
        /* 自定义聚焦效果包裹层 */
        .input-group:focus-within {
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
            border-radius: 0.4rem;
        }
    </style>
</head>
<body>
<div class="container" style="max-width: 450px;">
    <div class="card">
        <div class="card-header">
            <i class="fas fa-lock fa-3x mb-3"></i>
            <h5>安全中心 · 修改密码</h5>
        </div>
        <div class="card-body p-4">
            <form id="pwdForm">
                <div class="form-group">
                    <label class="text-muted small font-weight-bold">当前账号</label>
                    <input type="text" class="form-control bg-light" id="displayUsername" readonly>
                </div>

                <div class="form-group mt-3">
                    <label class="text-muted small font-weight-bold">原密码</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-key text-secondary"></i></span>
                        </div>
                        <input type="password" id="oldPwd" class="form-control" placeholder="请输入当前使用的密码" required>
                    </div>
                </div>

                <div class="form-group mt-3">
                    <label class="text-muted small font-weight-bold">新密码</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-lock text-primary"></i></span>
                        </div>
                        <input type="password" id="newPwd" class="form-control" placeholder="请输入新密码" required>
                    </div>
                </div>

                <div class="form-group mt-3">
                    <label class="text-muted small font-weight-bold">确认新密码</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-check-circle text-success"></i></span>
                        </div>
                        <input type="password" id="confirmPwd" class="form-control" placeholder="请再次输入新密码" required>
                    </div>
                </div>

                <button type="button" class="btn btn-primary btn-block btn-submit mt-4" onclick="submitPwd()">
                    确认修改并重新登录
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 工具：获取Cookie
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
        return null;
    }

    // 初始化：显示用户名
    document.addEventListener("DOMContentLoaded", function() {
        const username = getCookie('username');
        if(username) {
            document.getElementById('displayUsername').value = username;
        } else {
            alert("未检测到登录状态，请重新登录");
            window.top.location.href = '../DengLu/login.html';
        }
    });

    function submitPwd() {
        const username = document.getElementById('displayUsername').value;
        const oldPwd = document.getElementById('oldPwd').value;
        const newPwd = document.getElementById('newPwd').value;
        const confirmPwd = document.getElementById('confirmPwd').value;

        if(!oldPwd || !newPwd || !confirmPwd) {
            alert("请填写完整所有字段！");
            return;
        }

        if(newPwd !== confirmPwd) {
            alert("两次输入的新密码不一致，请检查！");
            return;
        }

        if(oldPwd === newPwd) {
            alert("新密码不能与旧密码相同！");
            return;
        }

        const payload = {
            username: username,
            oldPwd: oldPwd,
            newPwd: newPwd
        };

        // 发送请求
        fetch('/api/profile/change_password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        })
            .then(r => r.json())
            .then(res => {
                if(res.success) {
                    alert("修改成功！请使用新密码重新登录。");
                    // 清除 Cookie
                    document.cookie = "username=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
                    document.cookie = "role=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
                    // 跳转回登录页 (注意路径，因为这是iframe里的页面，要跳整个窗口)
                    window.top.location.href = '../DengLu/login.html';
                } else {
                    alert("修改失败：" + res.message);
                }
            })
            .catch(err => {
                console.error(err);
                alert("请求出错，请检查网络或服务器");
            });
    }
</script>
</body>
</html>
