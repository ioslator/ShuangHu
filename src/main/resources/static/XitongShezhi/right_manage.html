<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户权限管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; padding-bottom: 30px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .card { border: none; border-radius: 0.75rem; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05); margin-top: 1.5rem; overflow: hidden; }
        .card-header { background: linear-gradient(135deg, #007bff 0%, #0056b3 100%); color: white; padding: 1.2rem 1.5rem; }
        .card-header h4 { font-weight: 600; font-size: 1.25rem; margin: 0; }

        /* Action Area */
        .action-area { background-color: #fff; padding: 1rem 1.5rem; border-bottom: 1px solid #f0f0f0; }

        /* Table */
        .table-custom th { background-color: #f8f9fa; border-top: none; padding: 1rem; white-space: nowrap; }
        .table-custom td { vertical-align: middle; padding: 1rem; }
        .table-custom tr:hover { background-color: #fdfdfd; }

        .role-tag { padding: 4px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 600; }
        .status-active { color: #155724; background-color: #d4edda; padding: 4px 10px; border-radius: 4px; font-size: 0.85rem; font-weight: 600; }
        .status-inactive { color: #721c24; background-color: #f8d7da; padding: 4px 10px; border-radius: 4px; font-size: 0.85rem; font-weight: 600; }

        .btn-add { border-radius: 50px; font-weight: 600; box-shadow: 0 4px 6px rgba(40,167,69,0.2); }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="card shadow-lg">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4><i class="fas fa-users-cog mr-2"></i> 用户权限管理</h4>
            <span class="badge badge-light text-primary badge-pill px-3 py-2">Security & Roles</span>
        </div>

        <div class="action-area text-right">
            <button class="btn btn-success btn-add px-4" onclick="showAddUserModal()">
                <i class="fas fa-user-plus mr-1"></i> 新增用户
            </button>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-custom mb-0">
                    <thead>
                    <tr>
                        <th class="pl-4">ID</th>
                        <th>用户名</th>
                        <th>关联员工</th>
                        <th>系统角色</th>
                        <th>账户状态</th>
                        <th class="text-center">操作</th>
                    </tr>
                    </thead>
                    <tbody id="users-table-body">
                    <tr>
                        <td colspan="6" class="text-center text-muted py-5">
                            <div class="spinner-border spinner-border-sm text-primary" role="status"></div> 正在加载用户数据...
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editUserModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-light">
                <h5 class="modal-title font-weight-bold">编辑用户权限</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body p-4">
                <form id="edit-user-form">
                    <input type="hidden" id="edit-user-id">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" class="form-control bg-light" id="edit-username" readonly>
                    </div>
                    <div class="form-group">
                        <label>角色权限</label>
                        <select class="form-control" id="edit-user-role">
                            <option value="1">超级管理员 (Admin)</option>
                            <option value="2">部门经理 (Manager)</option>
                            <option value="3">普通员工 (Employee)</option>
                            <option value="4">访客 (Visitor)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>账户状态</label>
                        <select class="form-control" id="edit-user-status">
                            <option value="1">🟢 启用 (Active)</option>
                            <option value="0">🔴 禁用 (Disabled)</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary px-4" onclick="saveUserChanges()">保存更改</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addUserModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-light">
                <h5 class="modal-title font-weight-bold">新增系统用户</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body p-4">
                <form id="add-user-form">
                    <div class="form-group">
                        <label>登录用户名 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="add-username" placeholder="设置唯一用户名" required>
                    </div>
                    <div class="form-group">
                        <label>初始密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="add-password" placeholder="设置登录密码" required>
                    </div>
                    <div class="form-group">
                        <label>关联员工ID</label>
                        <input type="number" class="form-control" id="add-emp-id" placeholder="对应员工表的 emp_id">
                    </div>
                    <div class="form-group">
                        <label>分配角色</label>
                        <select class="form-control" id="add-user-role">
                            <option value="2">部门经理</option>
                            <option value="3" selected>普通员工</option>
                            <option value="4">访客</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-success px-4" onclick="addNewUser()">创建用户</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const roleMap = {
        1: '<span class="role-tag" style="background-color: #fff3cd; color: #856404;">超级管理员</span>',
        2: '<span class="role-tag" style="background-color: #cce5ff; color: #004085;">部门经理</span>',
        3: '<span class="role-tag" style="background-color: #e2e6ea; color: #343a40;">普通员工</span>',
        4: '<span class="role-tag" style="background-color: #f8f9fa; color: #6c757d; border:1px solid #dee2e6;">访客</span>'
    };
    let currentUser = { role: 1 }; // 模拟当前为管理员

    document.addEventListener('DOMContentLoaded', loadUsers);

    function loadUsers() {
        fetch('/api/users')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('users-table-body');

                // 兼容 List<SysUser> 和 Result<List>
                const users = Array.isArray(data) ? data : (data.data || []);

                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted"><i class="fas fa-inbox fa-3x mb-3 d-block text-light-gray"></i>暂无用户数据</td></tr>';
                    return;
                }

                let html = '';
                users.forEach(user => {
                    html += `
                        <tr>
                            <td class="pl-4 font-weight-bold text-muted">${user.user_id}</td>
                            <td class="font-weight-bold text-dark">${user.username}</td>
                            <td>${user.emp_name ? '<span class="text-info"><i class="fas fa-link mr-1"></i>'+user.emp_name+'</span>' : '<span class="text-muted small">无关联</span>'}</td>
                            <td>${roleMap[user.user_role]}</td>
                            <td>
                                ${user.user_status == 1 ?
                        '<span class="status-active"><i class="fas fa-check-circle mr-1"></i>启用</span>' :
                        '<span class="status-inactive"><i class="fas fa-ban mr-1"></i>禁用</span>'}
                            </td>
                            <td class="text-center">
                                ${currentUser.role === 1 ?
                        `<button class="btn btn-sm btn-outline-primary shadow-sm" onclick="editUser(${user.user_id})">
                                      <i class="fas fa-edit"></i> 编辑
                                   </button>` :
                        `<button class="btn btn-sm btn-light text-muted" disabled>无权操作</button>`}
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            })
            .catch(error => {
                document.getElementById('users-table-body').innerHTML =
                    '<tr><td colspan="6" class="text-center text-danger py-4">加载用户数据失败</td></tr>';
            });
    }

    function editUser(userId) {
        fetch(`/api/user/${userId}`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const user = data.data;
                    document.getElementById('edit-user-id').value = user.user_id;
                    document.getElementById('edit-username').value = user.username;
                    document.getElementById('edit-user-role').value = user.user_role;
                    document.getElementById('edit-user-status').value = user.user_status;
                    $('#editUserModal').modal('show');
                } else {
                    alert('获取失败: ' + data.message);
                }
            });
    }

    function saveUserChanges() {
        const userId = document.getElementById('edit-user-id').value;
        const userData = {
            user_id: userId,
            user_role: document.getElementById('edit-user-role').value,
            user_status: document.getElementById('edit-user-status').value
        };
        fetch(`/api/user/update`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userData)
        }).then(res => res.json()).then(data => {
            if (data.success) {
                $('#editUserModal').modal('hide');
                loadUsers();
            } else {
                alert('更新失败: ' + data.message);
            }
        });
    }

    function showAddUserModal() {
        if (currentUser.role !== 1) { alert('需要管理员权限'); return; }
        document.getElementById('add-user-form').reset();
        $('#addUserModal').modal('show');
    }

    function addNewUser() {
        const username = document.getElementById('add-username').value.trim();
        const password = document.getElementById('add-password').value;
        const empId = document.getElementById('add-emp-id').value;
        const userRole = document.getElementById('add-user-role').value;

        if (!username || !password) { alert('请填写必填项'); return; }

        const newUser = {
            username: username,
            password: password,
            emp_id: empId ? parseInt(empId) : null,
            user_role: parseInt(userRole),
            user_status: 1
        };

        fetch('/api/user/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newUser)
        }).then(res => res.json()).then(data => {
            if (data.success) {
                $('#addUserModal').modal('hide');
                loadUsers();
            } else {
                alert('创建失败: ' + data.message);
            }
        });
    }
</script>
</body>
</html>
