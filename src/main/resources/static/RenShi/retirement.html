<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>离职管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; padding-bottom: 30px; }
        .card { border: none; border-radius: 0.75rem; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05); margin-top: 1.5rem; overflow: hidden; }
        .card-header { background: linear-gradient(135deg, #007bff 0%, #0056b3 100%); color: white; padding: 1.2rem 1.5rem; }
        .card-header h4 { font-weight: 600; font-size: 1.25rem; margin: 0; }
        .table-custom th { background-color: #f8f9fa; border-top: none; padding: 1rem; }
        .table-custom td { vertical-align: middle; padding: 1rem; }
        .table-custom tr:hover { background-color: #fdfdfd; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="card shadow-lg">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4><i class="fas fa-user-slash mr-2"></i> 离职与退休档案</h4>
            <span class="badge badge-light text-primary badge-pill px-3 py-2">Resignation Archives</span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-custom mb-0">
                    <thead>
                    <tr>
                        <th class="pl-4">员工ID</th>
                        <th>变动类型</th>
                        <th>原因说明</th>
                        <th>申请/生效日期</th>
                        <th>审批状态</th>
                    </tr>
                    </thead>
                    <tbody id="list">
                    <tr><td colspan="5" class="text-center py-5 text-muted">正在读取档案...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    fetch('/api/resignations')
        .then(r => r.json())
        .then(data => {
            const tbody = document.getElementById('list');
            if(!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted"><i class="fas fa-inbox fa-3x mb-3 d-block text-light-gray"></i>暂无离职/退休记录</td></tr>';
                return;
            }
            const html = data.map(i => `
                <tr>
                    <td class="pl-4 font-weight-bold">${i.emp_id}</td>
                    <td><span class="badge badge-secondary">${i.type}</span></td>
                    <td class="text-muted">${i.reason}</td>
                    <td>${i.apply_date}</td>
                    <td><span class="badge badge-light border">${i.approve_status}</span></td>
                </tr>
            `).join('');
            tbody.innerHTML = html;
        })
        .catch(err => {
            document.getElementById('list').innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">数据加载异常</td></tr>';
        });
</script>
</body>
</html>
