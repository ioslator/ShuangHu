<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>发布公告</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; padding-bottom: 30px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .card { border: none; border-radius: 0.75rem; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05); margin-top: 1.5rem; overflow: hidden; }
        .card-header { background: linear-gradient(135deg, #007bff 0%, #0056b3 100%); color: white; padding: 1.2rem 1.5rem; }
        .card-header h4 { font-weight: 600; margin: 0; font-size: 1.25rem; }
        .form-control { border-radius: 0.4rem; height: calc(2.8rem + 2px); }
        textarea.form-control { height: auto; }
        .btn-submit { border-radius: 50px; padding: 10px 30px; font-weight: 600; box-shadow: 0 4px 6px rgba(0,123,255,0.2); }
        .btn-back { border-radius: 50px; padding: 10px 30px; }
        label { font-weight: 600; color: #495057; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="card shadow-lg">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4><i class="fas fa-bullhorn mr-2"></i> 发布新公告</h4>
            <span class="badge badge-light text-primary badge-pill px-3 py-2">System Notice</span>
        </div>
        <div class="card-body p-4">
            <form>
                <div class="row">
                    <div class="col-md-8">
                        <div class="form-group">
                            <label><i class="fas fa-heading text-primary mr-1"></i> 公告标题</label>
                            <input type="text" class="form-control" id="inputTitle" placeholder="请输入引人注目的标题..." required>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label><i class="fas fa-building text-success mr-1"></i> 发布部门</label>
                            <input type="text" class="form-control" id="inputDept" value="人事部" readonly>
                        </div>
                    </div>
                </div>

                <div class="form-group mt-2">
                    <label><i class="fas fa-align-left text-info mr-1"></i> 公告详情</label>
                    <textarea class="form-control" id="inputContent" rows="8" placeholder="在此输入详细的公告内容..." style="resize: vertical;"></textarea>
                </div>

                <div class="border-top pt-4 mt-3 text-right">
                    <a href="system_notice.html" class="btn btn-secondary btn-back mr-2"><i class="fas fa-arrow-left mr-1"></i> 返回列表</a>
                    <button type="button" class="btn btn-primary btn-submit" onclick="pub()"><i class="fas fa-paper-plane mr-1"></i> 立即发布</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function pub() {
        const titleVal = document.getElementById('inputTitle').value;
        const deptVal = document.getElementById('inputDept').value;
        const contentVal = document.getElementById('inputContent').value;

        if (!titleVal || !contentVal) {
            alert("标题和内容不能为空！");
            return;
        }

        const data = {
            notice_title: titleVal,
            notice_content: contentVal,
            publish_dept: deptVal
        };

        fetch('/api/notice/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
            .then(response => response.json())
            .then(res => {
                if (res.success) {
                    alert('发布成功！');
                    window.location.href = 'system_notice.html';
                } else {
                    alert('发布失败：' + res.msg);
                }
            })
            .catch(err => {
                console.error(err);
                alert("网络连接错误");
            });
    }
</script>
</body>
</html>
